# Source: zed-xim 0.4.0-zed, revision 471c10cdf97b3fcc2b7e0b3060f0085d1a7a27ec.
# Local changes: complete compound-text codec, explicit lifetimes, reset error propagation.
[package]
name = "zed-xim"
version = "0.4.0-zed"
edition = "2018"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/Riey/xim-rs"
publish = false

[features]
default = ["std"]
std = ["xim-parser/std", "xim-ctext/std", "ahash/std"]
client = []
server = []
bootstrap-parser = ["xim-parser/bootstrap"]
x11rb-client = ["client", "x11rb", "std"]
x11rb-server = ["server", "x11rb", "std"]
x11rb-xcb = ["x11rb/allow-unsafe-code", "std"]
xlib-client = ["client", "x11-dl", "std"]

[dependencies]
xim-parser = { version = "0.2.0", default-features = false }
xim-ctext = { version = "=0.4.1", default-features = false }
log = { version = "0.4", default-features = false }
ahash = { version = "0.8", default-features = false, features = ["compile-time-rng"] }
x11rb = { version = "0.13", optional = true }
x11-dl = { version = "2.18.5", optional = true }
hashbrown = { version = "0.14.0", default-features = false }
